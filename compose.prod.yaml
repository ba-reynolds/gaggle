# Production override: used on the AWS EC2 box by deploy/apply.sh as
#   docker compose -f compose.yaml -f compose.prod.yaml up --build -d
#
# Differences from local dev:
#   - db/redis ports are REMOVED (reachable only on the compose network)
#   - web publishes host ports 80 (HTTP) and 443 (HTTPS)
#   - APP_ENV=production enables the config fail-fast so a leaked dev
#     JWT_SECRET / DB_PASSWORD prevents the api from booting.
#   - COOKIE_SECURE=true. The API now sets the cookie's Secure attribute from
#     the ACTUAL client scheme (nginx sends X-Forwarded-Proto), so this value is
#     only the fallback for direct container access: plain-http browsers still
#     get a non-Secure cookie (otherwise their sessions would never persist)
#     while https clients keep Secure cookies.
#   - certbot service provisions real Let's Encrypt certs once HTTPS_DOMAIN
#     is set (see deploy/README.md)
name: gaggle

services:
  db:
    ports: !reset []

  redis:
    ports: !reset []

  api:
    ports: !reset []
    environment:
      APP_ENV: production
      COOKIE_SECURE: "true"
      SEED_ON_START: "${SEED_ON_START:-true}"

  web:
    # Production publishes 80 + 443 for this service. The actual host ports
    # come from the box's .env (WEB_PORT=80 / WEB_HTTPS_PORT=443, written by
    # deploy/apply.sh) and are interpolated by the base compose.yaml — so the
    # prod override doesn't re-declare ports (avoids list-merge surprises).
    # 443 serves TLS, 80 stays for ACME HTTP-01 validation + http://<ip>
    # access while no domain/real cert exists.

  # Provisions HTTPS credentials via Let's Encrypt once a domain points at
  # the box. HTTPS_DOMAIN is optional: until set, this container just waits,
  # but the ACME webroot volume (shared with web) is already in place so
  # certbot's HTTP-01 validation works the moment a domain is configured.
  #
  # The letsencrypt volume must be mounted at the SAME path (/etc/letsencrypt)
  # in both web and certbot so nginx sees everything certbot writes (live/ AND
  # archive/ — certbot's live/gaggle entries are symlinks into archive/).
  certbot:
    image: certbot/certbot:latest
    container_name: gaggle-certbot
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    environment:
      HTTPS_DOMAIN: ${HTTPS_DOMAIN:-}
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -n "$HTTPS_DOMAIN" ]; then
          # Check if we already have a real Let's Encrypt cert (not the self-signed
          # fallback generated by the web entrypoint). The self-signed cert has
          # issuer "gaggle-selfsigned"; a real cert's issuer contains "Let's Encrypt".
          if openssl x509 -in /etc/letsencrypt/live/gaggle/fullchain.pem -noout -issuer 2>/dev/null | grep -q "Let's Encrypt"; then
            echo "Real cert found, skipping issuance"
          else
            echo "No real cert (or self-signed fallback), issuing..."
            # Remove the self-signed fallback so certbot doesn't bail with
            # "live directory exists for gaggle" — it sees the directory
            # created by the web entrypoint and assumes it's already managed.
            rm -rf /etc/letsencrypt/live/gaggle /etc/letsencrypt/archive/gaggle /etc/letsencrypt/renewal/gaggle.conf
            certbot certonly --cert-name gaggle --webroot -w /var/www/certbot -d "$HTTPS_DOMAIN" --non-interactive --agree-tos --force-renewal || true
          fi
          while :; do
            certbot renew --cert-name gaggle --webroot -w /var/www/certbot --quiet || true
            sleep 12h
          done
        fi
        exec sleep infinity

volumes:
  # Same names as the ones declared in compose.yaml (compose merges top-level
  # declarations across override files), so the web + certbot services share.
  letsencrypt:
  certbot_www: