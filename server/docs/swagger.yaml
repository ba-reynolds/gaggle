host: localhost:2021
info:
  contact: {}
  description: API for GopherSocial, a social network for gophers
  title: GopherSocial API
  version: "1.0"
paths:
  /admin/badges:
    get:
      description: Returns every badge definition (earned + assigned). Admin only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_ba-reynolds_gophersocial_internal_models.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_ba-reynolds_gophersocial_internal_models.Badge'
                  type: array
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/github_com_ba-reynolds_gophersocial_internal_models.Envelope'
            - properties:
                data:
                  type: object
                error:
                  $ref: '#/definitions/github_com_ba-reynolds_gophersocial_internal_apperrors.AppError'
              type: object
        "500":
          description: Internal Server Error
          schema:
            allOf:
            - $ref: '#/definitions/github_com_ba-reynolds_gophersocial_internal_models.Envelope'
            - properties:
                data:
                  type: object
                error:
                  $ref: '#/definitions/github_com_ba-reynolds_gophersocial_internal_apperrors.AppError'
              type: object
      security:
      - ApiKeyAuth: []
      summary: List badge catalog
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: Registers a new admin-assigned badge definition. Admin only.
      parameters:
      - description: Badge definition
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/github_com_ba-reynolds_gophersocial_internal_models.CreateBadgePayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_ba-reynolds_gophersocial_internal_models.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_ba-reynolds_gophersocial_internal_models.Badge'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/github_com_ba-reynolds_gophersocial_internal_models.Envelope'
            - properties:
                data:
                  type: object
                error:
                  $ref: '#/definitions/github_com_ba-reynolds_gophersocial_internal_apperrors.AppError'
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/github_com_ba-reynolds_gophersocial_internal_models.Envelope'
            - properties:
                data:
                  type: object
