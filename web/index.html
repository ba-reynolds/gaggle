<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gaggle</title>
    <style>
      @keyframes gaggle-spin { to { transform: rotate(360deg); } }
    </style>
    <link rel="preload" as="image" href="/gaggle-goose.png" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Gochi+Hand&family=Architects+Daughter&family=Rock+Salt&family=Comic+Neue:wght@400;700&family=Bangers&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Gochi+Hand&family=Architects+Daughter&family=Rock+Salt&family=Comic+Neue:wght@400;700&family=Bangers&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root">
      <div
        style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;background:#ffffff;color:#18181b;font-family:inherit"
      >
        <img
          src="/gaggle-goose.png"
          alt="Gaggle"
          width="64"
          height="64"
          fetchpriority="high"
          decoding="async"
          style="width:4rem;height:4rem;border-radius:9999px"
        />
        <span style="font-size:1.5rem;font-weight:700">Gaggle</span>
        <span
          style="width:2rem;height:2rem;border:2px solid #18181b;border-top-color:transparent;border-radius:9999px;animation:gaggle-spin 1s linear infinite"
          aria-hidden="true"
        ></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
