gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

# Plain-HTTP listener. Host port 80 -> this (WEB_PORT; in prod set to 80).
# Also serves the certbot ACME webroot so let's-encrypt HTTP-01 validation
# works once HTTPS_DOMAIN points at the box (see deploy/README.md).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # certbot HTTP-01 challenge files. Certbot's webroot is mounted here.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Long-cache hashed build assets, but never cache index.html.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Reverse proxy to the API container. Keeps the path, so the browser is
    # same-origin (no CORS, no hardcoded host/port in the frontend).
    location /api/ {
        proxy_pass http://api:2021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/stream {
        proxy_pass http://api:2021;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI + OpenAPI spec, also proxied to the API.
    location /swagger/ {
        proxy_pass http://api:2021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback so client-side routes (e.g. /u/alice, /settings) work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# TLS listener. Serves whatever is at /etc/letsencrypt/live/gaggle: a
# self-signed fallback generated before boot by web/docker-entrypoint.sh,
# replaced by a real certbot cert once HTTPS_DOMAIN is provisioned (see
# deploy/README.md and compose.prod.yaml certbot service).
# Host port 443 -> this; 443 is open in the SG + firewalld.
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/gaggle/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gaggle/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 4h;

    root /usr/share/nginx/html;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Long-cache hashed build assets, but never cache index.html.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://api:2021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/stream {
        proxy_pass http://api:2021;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger/ {
        proxy_pass http://api:2021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback so client-side routes (e.g. /u/alice, /settings) work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
