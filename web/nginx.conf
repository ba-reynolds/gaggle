gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

# Plain-HTTP listener. Host port 80 -> this (WEB_PORT; in prod set to 80).
# Force-HTTPS policy: everything except the ACME HTTP-01 challenges 301s to
# https. The challenge location MUST stay here — Let's Encrypt validates over
# plain HTTP (including at every renewal); ^~ pins it above the catch-all.
server {
    listen 80;
    server_name _;

    # certbot HTTP-01 challenge files. Certbot's webroot is mounted here.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# TLS listener. Serves whatever is at /etc/letsencrypt/live/gaggle: a
# self-signed fallback generated before boot by web/docker-entrypoint.sh,
# replaced by a real certbot cert once HTTPS_DOMAIN is provisioned (see
# deploy/.env.production.template and compose.prod.yaml certbot service).
# Host port 443 -> this; 443 is open in the SG + firewalld.
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/gaggle/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gaggle/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 4h;

    # HSTS once browsers have seen this over a trusted cert. NOTE nginx
    # add_header inheritance: a location that declares ANY add_header (the
    # /assets/ and image-cache blocks below) inherits NOTHING from server
    # level, so the HSTS header must be repeated inside each of them.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /usr/share/nginx/html;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Long-cache hashed build assets, but never cache index.html.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Cache static public assets (goose, favicon) — previously no Cache-Control,
    # so every navigation re-fetched the 121KB image even though it never changes.
    location ~* \.(png|jpg|jpeg|webp|avif|ico|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Reverse proxy to the API container. Keeps the path, so the browser is
    # same-origin (no CORS, no hardcoded host/port in the frontend).
    location /api/ {
        proxy_pass http://api:2021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/stream {
        proxy_pass http://api:2021;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI + OpenAPI spec, also proxied to the API.
    location /swagger/ {
        proxy_pass http://api:2021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback so client-side routes (e.g. /u/alice, /settings) work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
