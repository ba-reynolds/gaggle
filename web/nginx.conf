server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed build assets, but never cache index.html.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Reverse proxy to the API container. Keeps the path, so the browser is
    # same-origin (no CORS, no hardcoded host/port in the frontend).
    location /api/ {
        proxy_pass http://api:2021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/stream {
        proxy_pass http://api:2021;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI + OpenAPI spec, also proxied to the API.
    location /swagger/ {
        proxy_pass http://api:2021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback so client-side routes (e.g. /u/alice, /settings) work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
